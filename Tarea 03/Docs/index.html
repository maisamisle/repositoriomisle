<article class="reportaje">

  <header>
    <h1>Nacer en Gaza mientras se destruyen los hospitales</h1>

    <p class="bajada">
      Los ataques a la infraestructura sanitaria de la Franja de Gaza
      han dificultado el acceso a la atención médica. Los registros
      entre 2023 y 2025 muestran cómo los ataques, los asedios y los
      bloqueos han afectado a los hospitales del territorio.
    </p>
  </header>

  <figure class="imagen-destacada">
    <img
      src="https://live-production.wcms.abc-cdn.net.au/aa9fba38a5951745bc8a5d1da45974d7?cropH=3333&cropW=5000&height=575&impolicy=wcms_crop_resize&width=862&xPos=0&yPos=0"
      alt="Edificio del hospital Al-Shifa gravemente destruido en Gaza, abril de 2024"
      loading="eager">

    <figcaption>
      El hospital Al-Shifa, en Ciudad de Gaza, quedó gravemente
      dañado tras una operación militar de dos semanas.
      Abril de 2024. Fotografía: Dawoud Abu Alkas / Reuters.
      <a href="https://www.abc.net.au/news/2024-04-01/israeli-military-withdraws-from-gaza-al-shifa-hospital/103655580"
         target="_blank" rel="noopener">Fuente</a>.
    </figcaption>
  </figure>

  <section>

    <p>
      Nacer en Gaza se ha vuelto cada vez más difícil. Para una mujer
      embarazada, dar a luz implica necesitar un hospital en funcionamiento,
      personal médico y los recursos necesarios para enfrentar posibles
      complicaciones. Sin embargo, en medio del genocidio, la red sanitaria
      de la Franja ha sufrido ataques y restricciones que dificultan
      la atención de pacientes.
    </p>

    <p>
      Entre 2023 y 2025, se registraron
      <strong>795 incidentes relacionados con hospitales</strong>
      en las cinco gobernaciones de Gaza: Gaza Norte, Gaza Ciudad,
      Khan Younis, Deir al Balah y Rafah. Los datos incluyen ataques
      directos y violencia armada, operaciones de control y asedio,
      obstrucción logística y otros episodios que no pudieron
      clasificarse con mayor detalle.
    </p>

    <p>
      El año 2024 fue el que concentró más incidentes, con
      <strong>364 registros</strong>. En 2023 se contabilizaron 252,
      mientras que en el periodo documentado de 2025 se registraron
      otros 179. Las cifras muestran la magnitud de las agresiones
      contra los centros de salud durante estos años, aunque no
      permiten conocer por sí solas cuántas personas quedaron
      sin atención médica.
    </p>

  </section>
